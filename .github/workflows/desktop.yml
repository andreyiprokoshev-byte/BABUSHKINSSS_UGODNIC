name: Desktop EXE Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            bundle: nsis
          - os: ubuntu-24.04
            bundle: deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb xauth libegl-mesa0 libgl1-mesa-dri

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo crates and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build desktop application
        run: npm run desktop:build -- --bundles ${{ matrix.bundle }} -- --locked

      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb "$RUNNER_TEMP/desktop-package"
          xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/smoke_desktop.py "$RUNNER_TEMP/desktop-package/usr/bin/pirozhkovy-dvor"

      - name: Install and smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (!$installer) { throw "Missing NSIS installer" }
          $installDir = Join-Path $env:RUNNER_TEMP "pirozhkovy-dvor"
          $process = Start-Process $installer.FullName -ArgumentList "/S /D=$installDir" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit $($process.ExitCode)" }
          python scripts/smoke_desktop.py (Join-Path $installDir "pirozhkovy-dvor.exe")

      - name: Upload Windows EXE installer & portable binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/pirozhkovy-dvor.exe

      - name: Upload Linux deb package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-package
          if-no-files-found: error
          path: src-tauri/target/release/bundle/deb/*.deb
