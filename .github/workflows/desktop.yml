name: Desktop builds

on:
  push:
    branches: [main, 'desktop/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }} x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
            artifact: linux-x64
          - os: windows-2025
            bundle: nsis
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Linux webview and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libegl-mesa0 libgl1-mesa-dri xvfb xauth
      - name: Install JS dependencies and check types
        run: |
          bun install --frozen-lockfile
          bun run lint
      - name: Build desktop package
        run: bun run desktop:build --bundles ${{ matrix.bundle }} -- --locked
      - name: Start the Linux build in WebKitGTK
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb "$RUNNER_TEMP/desktop-package"
          xvfb-run -a -s '-screen 0 1280x900x24' python scripts/smoke_desktop.py "$RUNNER_TEMP/desktop-package/usr/bin/pirozhkovy-dvor"
      - name: Install and start the Windows build in WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (!$installer) { throw "Missing NSIS installer" }
          $installDir = Join-Path $env:RUNNER_TEMP "pirozhkovy-dvor"
          $process = Start-Process $installer.FullName -ArgumentList "/S /D=$installDir" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit $($process.ExitCode)" }
          python scripts/smoke_desktop.py (Join-Path $installDir "pirozhkovy-dvor.exe")
      - uses: actions/upload-artifact@v4
        with:
          name: pirozhkovy-dvor-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/${{ matrix.bundle }}/*
          if-no-files-found: error
