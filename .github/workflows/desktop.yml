name: Desktop EXE Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            bundle: nsis
          - os: ubuntu-24.04
            bundle: deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo crates and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build desktop application
        run: npm run desktop:build -- --bundles ${{ matrix.bundle }} -- --locked

      - name: Smoke test Linux desktop binary
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/smoke_desktop.py

      - name: Upload Windows EXE installer & portable binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/pirozhkovy-dvor.exe

      - name: Upload Linux deb package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-package
          path: src-tauri/target/release/bundle/deb/*.deb
